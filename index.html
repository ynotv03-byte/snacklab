<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173e32"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>SnackLab Performance</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f0;color:#18372d;font:16px system-ui}header{background:#173e32;color:white;padding:24px 20px}header small{color:#b9d6c4}h1,h2,h3,p{margin:0 0 12px}main{max-width:650px;margin:auto;padding:18px 16px 110px}.card{background:white;border:1px solid #dce4da;border-radius:18px;padding:16px;margin:12px 0}button,input,select{font:inherit;border-radius:12px;padding:12px;border:1px solid #cbd8cc;background:white;color:inherit}button{cursor:pointer}button.primary{background:#245c43;color:white;border:0;width:100%;font-weight:650}label{display:block;margin:12px 0 5px;font-size:13px;font-weight:650}input:not([type=checkbox]),select{width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chips label{border:1px solid #dce4da;padding:10px;border-radius:12px;margin:0}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dce4da;display:flex;justify-content:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:5}nav button{border:0;background:none;font-size:11px;flex:1;max-width:130px;padding:8px 2px}nav b{display:block;font-size:23px}nav .on{color:#237348;font-weight:800}small,.muted{color:#65776b;font-size:13px}.tag{display:inline-block;background:#e8f2e9;border-radius:20px;padding:5px 10px;font-size:12px;margin-bottom:8px}.warn{background:#fff4dc;color:#79561a}.pick{border:1px solid #dce4da;border-radius:12px;padding:12px;margin:8px 0}.chosen{border:2px solid #398454;background:#f0f8ef}details{margin:10px 0}summary{cursor:pointer;font-weight:650} .line{border-left:3px solid #91b39a;padding:8px 12px;margin:8px 0}.danger{color:#a33}button.slim{padding:7px 10px;font-size:13px}footer{font-size:12px;color:#65776b;margin-top:20px}</style><header><small>PERFORMANCE EDITION · 4.1</small><h1 style="margin:5px 0">SnackLab</h1><small>Jouw training. Jouw voeding.</small></header><main id="app"><p>SnackLab wordt geladen… Open de gehoste versie in Safari als dit bericht blijft staan.</p></main><nav id="nav"></nav><script>
const R=[
['Snackwortels met knoflookdip',90,6,13,2,4,200,'150 g snackwortels;50 g Griekse yoghurt;½ teen knoflook;peper','Meng yoghurt, knoflook en peper. Serveer als dip.'],

['Chocolade-bananenpudding',260,28,33,3,4,285,'1 banaan;150 g magere kwark;15 g chocolade-whey;1 tl cacao','Blend en koel.'],

['Crispy honing-mosterd kipwrap',345,29,34,10,5,280,'1 volkoren wrap;100 g kipfilet;40 g Griekse yoghurt 2%;1 tl mosterd;½ tl honing;¼ komkommer;25 g ijsbergsla','Bak kip volledig gaar. Meng saus, beleg wrap en rooster in droge pan.'],

['Chocolade-frambozen bananenpancakes',365,30,34,12,8,345,'1 banaan;2 eieren;20 g chocolade-whey;75 g frambozen;30 g magere kwark','Prak banaan, meng met ei en whey, bak pancakes. Serveer met kwark en frambozen.']];
const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let db={plans:[],ratings:{},sensitive:false};try{db={...db,...JSON.parse(localStorage.getItem('snacklab41')||'{}')}}catch{};let page='home',active=null;const $=id=>document.getElementById(id);function save(){try{localStorage.setItem('snacklab41',JSON.stringify(db))}catch{alert('Lokale opslag niet beschikbaar. Exporteer je gegevens via Profiel.')}}function go(p){page=p;render();scrollTo(0,0)}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const min=t=>+t.slice(0,2)*60+ +t.slice(3);const clock=n=>`${String(Math.floor((n%1440+1440)%1440/60)).padStart(2,'0')}:${String((n%60+60)%60).padStart(2,'0')}${n>=1440?' (+1 dag)':n<0?' (vorige dag)':''}`;const sports=['Krachttraining','Voetbal','Hardlopen','Padel','Fietsen','Wandelen'];const muscles=['Borst','Biceps','Triceps','Schouders','Rug','Benen','Buik','Billen'];function render(){ $('nav').innerHTML=[['home','⌂','Vandaag'],['agenda','▦','Agenda'],['food','⚡','Sportvoeding'],['recipes','▤','Recepten'],['profile','◎','Profiel']].map(([p,i,n])=>`<button class="${page===p?'on':''}" onclick="go('${p}')"><b>${i}</b>${n}</button>`).join('');let a=$('app');if(page==='home'||page==='agenda'){let ps=db.plans.filter(p=>page==='agenda'||p.date===today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));a.innerHTML=`<h2>${page==='home'?'Vandaag':'Mijn agenda'}</h2><p class="muted">${page==='home'?new Date().toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'}):'Al je geplande trainingen'}</p><button class="primary" onclick="edit()">＋ Training plannen</button>${ps.length?ps.map(planCard).join(''):'<div class="card">Nog geen trainingen gepland.</div>'}<div class="card"><h3>23 snacks</h3><p class="muted">Kies voeding die past bij je training, niet alleen bij je smaak.</p><button onclick="go('recipes')">Bekijk recepten</button></div>`}else if(page==='edit'){form()}else if(page==='food'){food()}else if(page==='recipes'){a.innerHTML='<h2>Recepten</h2><input placeholder="Zoek een snack" oninput="recipeList(this.value)"><div id="list"></div>';recipeList('')}else{a.innerHTML=`<h2>Mijn profiel</h2><div class="card"><h3>Smaak-DNA</h3>60% hartig · 40% zoet<p class="muted">Eerdere favorieten: honing-mosterdwrap, ei-avocadowrap en chocolade-frambozenmousse.</p><label><input type="checkbox" ${db.sensitive?'checked':''} onchange="db.sensitive=this.checked;save()"> Gevoelige maag tijdens sport</label></div><div class="card"><h3>Gegevens</h3><p>Je planning en beoordelingen worden lokaal opgeslagen in deze browser.</p><button onclick="backup()">Exporteer back-up</button><label>Back-up herstellen</label><input type="file" accept="application/json" onchange="restore(this.files[0])"></div><footer>Hazelnootallergie: controleer altijd etiketten en kruisbesmetting. Voedingswaarden zijn schattingen.</footer>`}}
function planCard(p){return `<div class="card"><span class="tag">${p.done?'Afgerond':esc(p.date)}</span><h3>${esc(p.time)} · ${esc(p.sport)}</h3><p class="muted">${p.duration} min · ${esc(p.intensity)} · ${esc(p.groups.join(', '))}</p>${['pre','post'].filter(k=>p[k+'Enabled']).map(k=>`<div class="line"><small>${k==='pre'?clock(min(p.time)-p.lead):clock(min(p.time)+p.duration+p.delay)} · ${k==='pre'?'Vooraf':'Achteraf'}</small><br>${p[k+'Pick']?pickName(p[k+'Pick']):'Nog geen snack gekozen'}</div>`).join('')}<button class="primary" onclick="active='${p.id}';go('food')">Sportvoeding bekijken</button><p style="margin-top:10px"><button class="slim" onclick="edit('${p.id}')">Aanpassen</button> <button class="slim" onclick="toggle('${p.id}')">${p.done?'Heropen':'Afronden'}</button> <button class="slim danger" onclick="removePlan('${p.id}')">Verwijderen</button></p></div>`}function pickName(x){return x.i<0?'Geen extra snack':esc(R[x.i][0])+' · '+x.n+' portie'}function toggle(id){let p=db.plans.find(x=>x.id===id);p.done=!p.done;save();render()}function removePlan(id){if(confirm('Training verwijderen?')){db.plans=db.plans.filter(x=>x.id!==id);save();render()}}let draft;function edit(id){draft=db.plans.find(p=>p.id===id)||{id:Date.now().toString(),date:today(),time:'20:00',sport:'Voetbal',groups:[],duration:90,intensity:'Normaal',meal:'18:00',size:'Normaal',lead:45,delay:30,preEnabled:true,postEnabled:true,hungry:false,nextMeal:false,hot:false};page='edit';render();scrollTo(0,0)}function opts(a,v){return a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}function form(){let p=draft;$('app').innerHTML=`<h2>Training plannen</h2><form class="card" onsubmit="submitPlan(event)"><div class="grid"><div><label>Datum</label><input name="date" type="date" required value="${p.date}"></div><div><label>Start</label><input name="time" type="time" required value="${p.time}"></div></div><label>Sport</label><select name="sport" onchange="$('muscles').hidden=this.value!=='Krachttraining'">${opts(sports,p.sport)}</select><div id="muscles" ${p.sport!=='Krachttraining'?'hidden':''}><label>Spiergroepen</label><div class="chips">${muscles.map(m=>`<label><input type="checkbox" name="groups" value="${m}" ${p.groups.includes(m)?'checked':''}> ${m}</label>`).join('')}</div></div><div class="grid"><div><label>Duur (min)</label><input type="number" name="duration" min="10" max="300" required value="${p.duration}"></div><div><label>Intensiteit</label><select name="intensity">${opts(['Rustig','Normaal','Zwaar'],p.intensity)}</select></div></div><h3 style="margin-top:20px">Eetmomenten</h3><div class="grid"><div><label>Laatste maaltijd</label><input name="meal" type="time" required value="${p.meal}"></div><div><label>Maaltijdgrootte</label><select name="size">${opts(['Klein','Normaal','Groot'],p.size)}</select></div></div><label><input type="checkbox" name="preEnabled" ${p.preEnabled?'checked':''}> Snack vooraf</label><label>Minuten vóór training</label><input name="lead" type="number" min="0" max="240" value="${p.lead}" required><label><input type="checkbox" name="postEnabled" ${p.postEnabled?'checked':''}> Snack achteraf</label><label>Minuten na afloop</label><input name="delay" type="number" min="0" max="240" value="${p.delay}" required><label><input type="checkbox" name="hungry" ${p.hungry?'checked':''}> Verwacht nog trek vooraf</label><label><input type="checkbox" name="nextMeal" ${p.nextMeal?'checked':''}> Volledige maaltijd binnen een uur na afloop</label><label><input type="checkbox" name="hot" ${p.hot?'checked':''}> Warm weer / veel zweten</label><button class="primary" style="margin-top:16px">Opslaan & snacks kiezen</button></form>`}function submitPlan(e){e.preventDefault();let f=new FormData(e.target),p={...draft};for(let k of ['date','time','sport','intensity','meal','size'])p[k]=f.get(k);for(let k of ['duration','lead','delay'])p[k]=+f.get(k);for(let k of ['preEnabled','postEnabled','hungry','nextMeal','hot'])p[k]=f.has(k);p.groups=p.sport==='Krachttraining'?f.getAll('groups'):[];if(p.preEnabled&&min(p.meal)>min(p.time)-p.lead){alert('Kies een maaltijd vóór je geplande snack op dezelfde dag.');return}delete p.prePick;delete p.postPick;db.plans=db.plans.filter(x=>x.id!==p.id).concat(p);active=p.id;save();go('food')}
function food(){let p=db.plans.find(x=>x.id===active)||db.plans[0];if(!p){$('app').innerHTML='<h2>Sportvoeding</h2><div class="card">Plan eerst een training.</div><button class="primary" onclick="edit()">Training plannen</button>';return}active=p.id;let since=min(p.time)-p.lead-min(p.meal),full=since<120&&p.size!=='Klein',impact=['Voetbal','Hardlopen'].includes(p.sport),strict=p.lead<=60&&(impact||full||db.sensitive),heavy=p.intensity==='Zwaar'||p.duration>=75&&p.intensity!=='Rustig',optional=full&&!p.hungry||p.duration<=30&&p.intensity!=='Zwaar'&&!p.hungry;let pre=R.map((r,i)=>{let n=strict||full?.5:1,c=r[3]*n,f=r[4]*n,fi=r[5]*n,w=r[6]*n,bad=strict&&(w>150||f>5||fi>3||[8,11].includes(i))||p.lead<=90&&f>10;let score=100-Math.max(0,(full?10:20)-c)*2-f*5-fi*4-Math.max(0,w-100)*.2;return {i,n,bad,score}}).sort((a,b)=>b.score-a.score);let post=R.map((r,i)=>({i,n:1,score:100-Math.max(0,25-r[2])*2.5-Math.max(0,(heavy?35:15)-r[3])*1.7+(db.ratings[i]||0)})).sort((a,b)=>b.score-a.score);$('app').innerHTML=`<h2>Sportvoeding</h2><select onchange="active=this.value;food()">${db.plans.map(x=>`<option value="${x.id}" ${x.id===active?'selected':''}>${esc(x.date+' · '+x.time+' · '+x.sport)}</option>`).join('')}</select><div class="card"><h3>${esc(p.sport)} · ${p.duration} min</h3><p class="muted">Maaltijd ${p.meal} · Training ${p.time}–${clock(min(p.time)+p.duration)}</p><button class="slim" onclick="edit('${p.id}')">Timing aanpassen</button></div>${p.preEnabled?`<h2>⚡ Voor de training</h2><p class="muted">${clock(min(p.time)-p.lead)} · ${p.lead} minuten vooraf</p><div class="card">${optional?'Waarschijnlijk geen extra snack nodig als je maaltijd voldoende energie bevatte.':strict?'Kies een kleine, licht verteerbare koolhydraatrijke snack.':'Koolhydraten en eventueel wat eiwit, afhankelijk van je trek.'}</div>${choice(p,'pre',{i:-1,n:0},'Water naar behoefte; geen extra calorieën.')}${pre.filter(o=>!o.bad).slice(0,4).map(o=>choice(p,'pre',o,o.i===5?'Kleine portie, weinig vet, beschikbare koolhydraten.':'Let op portiegrootte en persoonlijke tolerantie.')).join('')}<details><summary>Meer geschikte snacks</summary>${pre.filter(o=>!o.bad).slice(4).map(o=>choice(p,'pre',o,'Aanvullende optie.')).join('')}</details><details><summary>Minder geschikt (${pre.filter(o=>o.bad).length})</summary>${pre.filter(o=>o.bad).map(o=>`<div class="pick"><b>${R[o.i][0]}</b><p class="muted">${[8,11].includes(o.i)?'Veel volume en zuivel vlak voor inspanning.':'Relatief veel volume, vet of vezels voor dit moment.'}</p></div>`).join('')}</details>`:''}${p.postEnabled?`<h2 style="margin-top:24px">↻ Na de training</h2><p class="muted">${clock(min(p.time)+p.duration+p.delay)} · ${p.delay} minuten na afloop</p><div class="card">${p.nextMeal?'Een volledige maaltijd kan je herstelsnack vervangen.':heavy?'Vul koolhydraten, eiwitten en vocht aan.':'Eiwit en normale maaltijden ondersteunen herstel.'}</div>${choice(p,'post',{i:-1,n:0},'Normale maaltijden en water.')}${post.slice(0,5).map(o=>choice(p,'post',o,[8,11].includes(o.i)?'Eiwit, koolhydraten en vocht; volume is nu minder bezwaarlijk.':'Aanvullende energie en eiwit voor herstel.')).join('')}<details><summary>Alle overige herstelsnacks</summary>${post.slice(5).map(o=>choice(p,'post',o,'Aanvullende voeding.')).join('')}</details>`:''}<div class="card"><h3>💧 Hydratatie</h3><p>Drink verspreid vooraf, vlak voor de start kleine slokken. ${p.duration>=60||p.hot?'Tijdens: circa 400–800 ml/uur als indicatieve bandbreedte, afgestemd op dorst en zweetverlies.':'Tijdens: water naar behoefte.'} Na afloop geleidelijk aanvullen.</p>${p.hot||p.duration>=90?'<p>Bij veel zweten kan extra natrium nuttig zijn.</p>':''}${heavy&&['Voetbal','Hardlopen','Padel','Fietsen'].includes(p.sport)?'<p>Bij langdurige intensieve inspanning: overweeg 30–60 g koolhydraten per uur.</p>':''}</div><button class="primary" onclick="go('agenda')">Bekijk mijn planning</button><footer>Indicatieve voedingswaarden en selectiecriteria, geen medische score. Controleer allergenen.</footer>`}function choice(p,k,o,why){let r=R[o.i],sel=p[k+'Pick']?.i===o.i&&p[k+'Pick']?.n===o.n;return `<div class="pick ${sel?'chosen':''}"><b>${o.i<0?'Geen extra snack':r[0]}</b><p class="muted">${r?`${o.n} portie · ±${Math.round(r[1]*o.n)} kcal · ${Math.round(r[3]*o.n)} g KH · ${Math.round(r[2]*o.n)} g eiwit`:'0 kcal'}</p><p style="font-size:14px">${why}</p><button class="slim" onclick="choose('${p.id}','${k}',${o.i},${o.n},this)">${sel?'✓ Gekozen':'Kies snack'}</button>${r?`<details><summary>Ingrediënten (1 portie)</summary>${r[7].split(';').map(x=>`<label><input type="checkbox"> ${esc(x)}</label>`).join('')}<p>${esc(r[8])}</p></details>`:''}</div>`}function choose(id,k,i,n,el){let p=db.plans.find(x=>x.id===id);p[k+'Pick']={i,n};save();let y=scrollY;food();scrollTo(0,y)}function recipeList(q){$('list').innerHTML=R.map((r,i)=>({r,i})).filter(({r})=>r[0].toLowerCase().includes(q.toLowerCase())).map(({r,i})=>`<details class="card"><summary>${r[0]}</summary><p class="muted">${r[1]} kcal · ${r[2]} g eiwit · ${r[3]} g KH</p>${r[7].split(';').map(x=>`<label><input type="checkbox"> ${esc(x)}</label>`).join('')}<p style="margin-top:12px">${esc(r[8])}</p><label>Beoordeling</label><select onchange="db.ratings[${i}]=+this.value;save()">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${(db.ratings[i]||0)===n?'selected':''}>${n?'★'.repeat(n):'Nog te proberen'}</option>`).join('')}</select></details>`).join('')}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='snacklab-backup.json';a.click();URL.revokeObjectURL(a.href)}async function restore(f){if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.plans)||!d.ratings)throw Error();db=d;save();render()}catch{alert('Ongeldige back-up')}}render();</script><script>if("serviceWorker" in navigator && location.protocol === "https:"){navigator.serviceWorker.register("./sw.js").catch(console.warn)}</script></html>
